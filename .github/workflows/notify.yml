name: YouTube Viral Game Notifier

on:
  schedule:
    # 毎日 午前9:00 (JST) に自動実行 (UTC基準のため 00:00)
    - cron: '0 0 * * *'
  # 手動実行用ボタン（テスト用）
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: コードの取得
        uses: actions/checkout@v4.2.2

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests

      - name: プログラムの実行
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
